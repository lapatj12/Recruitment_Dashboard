<style>
  #tab-employees .table-pager { display: none; }
</style>
<script>
(function () {
  var tbody = document.getElementById('empTableBody');
  var next  = document.getElementById('empNext');
  var prev  = document.getElementById('empPrev');
  var label = document.getElementById('empPageLabel');
  if (!tbody || !next || !prev) return;

  var busy = false, timer = null;

  function isLast() {
    if (next.disabled || next.classList.contains('disabled')) return true;
    var m = /(\d+)\s*\/\s*(\d+)/.exec(label ? label.textContent : '');
    return !!(m && m[1] === m[2]);
  }
  function isFirst() {
    if (prev.disabled || prev.classList.contains('disabled')) return true;
    var m = /(\d+)\s*\/\s*(\d+)/.exec(label ? label.textContent : '');
    return !!(m && m[1] === '1');
  }

  function expand() {
    if (busy) return;
    busy = true;
    var guard = 0;
    while (!isFirst() && guard++ < 500) prev.click();   // กลับไปหน้า 1 ก่อน
    var html = tbody.innerHTML;
    var last = html;
    guard = 0;
    while (!isLast() && guard++ < 500) {
      next.click();
      if (tbody.innerHTML === last) break;              // กันวนไม่รู้จบ
      last = tbody.innerHTML;
      html += last;
    }
    tbody.innerHTML = html;
    observer.takeRecords();                             // ไม่ให้ตัวเองทริกเกอร์ซ้ำ
    busy = false;
  }

  var observer = new MutationObserver(function () {
    if (busy) return;
    clearTimeout(timer);
    timer = setTimeout(expand, 60);
  });
  observer.observe(tbody, { childList: true });
})();
</script>
